    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Omitimos el paso "chmod" ya que tu carpeta "Bero" no contiene el archivo ejecutable gradlew

      - name: Compilar el APK
        run: gradle assembleDebug
        working-directory: Bero

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Bero/app/build/outputs/apk/debug/app-debug.apk
