name: Compilar APK de Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar el APK
        run: gradle testDebugUnitTest assembleDebug
        working-directory: Bero

      - name: Subir informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: Bero/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Bero/app/build/outputs/apk/debug/app-debug.apk
