<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bero · Spotify</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#120f24;color:#fff;display:flex;flex-direction:column;
         align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
    a{background:#9b7bff;color:#120f24;padding:14px 28px;border-radius:24px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <h2>Volviendo a Bero…</h2>
  <p>Si la app no se abre sola, toca el botón.</p>
  <p><a id="open" href="#">Abrir Bero</a></p>
  <script>
    // Spotify redirige aqui (HTTPS, aceptado por el Dashboard) y esta pagina reenvia el code/state a la app.
    var target = "com.example.bero://spotify-callback" + window.location.search;
    document.getElementById("open").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
